[package]
name = "agentrec"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Local, offline flight recorder for AI coding agents — a tamper-evident, revertible record of every edit and command, that never leaves your machine."
authors = ["nico-perales <289412610+nico-perales@users.noreply.github.com>"]
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/nico-perales/agentrec"
keywords = ["ai", "agents", "audit", "security", "claude-code"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["/.github"]

[features]
default = ["cli"]
cli = ["watch", "dep:clap", "dep:anyhow"]
# Filesystem watching (`agentrec watch`); pulls in the OS notify backend.
watch = ["dep:notify"]

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
similar = "2.7.0"
anstyle = "1.0.14"
thiserror = "2.0.20"
toml = "0.9"

clap = { version = "4.6.5", features = ["derive"], optional = true }
anyhow = { version = "1.0.104", optional = true }
notify = { version = "8", optional = true }

[[bin]]
name = "agentrec"
required-features = ["cli"]

[lib]
name = "agentrec"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
